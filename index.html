<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>だれの ものがたり？ ～ひとびと伝説～</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:'DotGothic16',monospace}
body{position:fixed;inset:0;width:100%}
/* ===== 画面レイアウト（縦持ち）：上にゲーム画面、残りぜんぶを操作エリアに使う ===== */
#app{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);box-sizing:border-box}
canvas{width:min(100vw,640px,calc((100dvh - 230px - env(safe-area-inset-top))*512/448));background:#000;display:block;touch-action:none;flex:none}
/* 操作エリア。位置・大きさは JS(layoutCtl) が --u(=Aボタンの直径) を決めて、そこから全部を割り出す */
#ctl{--u:80px;--pad:12px;position:relative;flex:1 1 auto;width:min(100vw,640px);min-height:190px;touch-action:none;
  --dp:calc(var(--u)*2.3);--B:calc(var(--u)*.86);--hit:calc(var(--u)*.09);--op:.82}
button,.pad{font:inherit;touch-action:none}
button{background:#1a1f3a;color:#fff;border:3px solid #fff;border-radius:14px;font-size:22px;padding:0;transition:transform .05s,background .05s}
button.on,.pad.on{background:#6a7cff;transform:scale(.94)}
/* 十字キー：見た目は丸いパッド。タッチ判定は #dpz（見た目より広い）が受け持つ */
#dpz{position:absolute;touch-action:none;z-index:2}
#dp{position:absolute;left:calc(env(safe-area-inset-left) + var(--pad));bottom:calc(env(safe-area-inset-bottom) + var(--pad));width:var(--dp);height:var(--dp);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--u)*.04);box-sizing:border-box;padding:calc(var(--u)*.08);
  border-radius:50%;background:radial-gradient(circle,#ffffff26,#ffffff0d 62%,#0000 74%);box-shadow:inset 0 0 0 2px #ffffff30;opacity:var(--op);pointer-events:none;z-index:1}
#dp button{width:100%;height:100%;border-radius:calc(var(--u)*.2);border-width:2px;font-size:calc(var(--u)*.3);pointer-events:none;display:flex;align-items:center;justify-content:center}
#dp button.on{background:#8fa0ff;box-shadow:0 0 calc(var(--u)*.25) #8fa0ff;transform:none}
/* A / B / はしる：親指の弧に合わせて ずらして配置（Bは左うえ、Aは右した、はしるは左した） */
#ab{position:absolute;right:calc(env(safe-area-inset-right) + var(--pad));bottom:calc(env(safe-area-inset-bottom) + var(--pad) + var(--u)*.3);
  width:calc(var(--u) + var(--B) + var(--u)*.14);height:calc(var(--B) + var(--u)*.5);opacity:var(--op);z-index:2}
#ab button{position:absolute;border-radius:50%;font-size:calc(var(--u)*.3)}
#ab button::after{content:'';position:absolute;inset:calc(var(--hit)*-1);border-radius:50%}   /* 見た目より広い当たり判定 */
#ab button[data-k=a]{right:0;bottom:0;width:var(--u);height:var(--u);background:#2a2f66}
#ab button[data-k=b]{left:0;bottom:calc(var(--u)*.5);width:var(--B);height:var(--B)}
#ab button.run{left:0;bottom:0;width:var(--B);height:calc(var(--u)*.38);border-radius:calc(var(--u)*.19);font-size:max(11px,calc(var(--u)*.17));border-width:2px;line-height:1;white-space:nowrap;overflow:visible}
#ab button.run.on{background:#e0a030;color:#000;transform:none}
#ctl.swap #dp{left:auto;right:calc(env(safe-area-inset-right) + var(--pad))}
#ctl.swap #ab{right:auto;left:calc(env(safe-area-inset-left) + var(--pad))}
/* 上のほうのボタン */
.top{position:fixed;top:max(6px,env(safe-area-inset-top));width:36px;height:36px;border-width:2px;border-radius:50%;font-size:16px;opacity:.7;z-index:6}
#mute{right:max(8px,env(safe-area-inset-right))}
#cfgb{right:calc(max(8px,env(safe-area-inset-right)) + 44px)}
/* 操作せってい */
#cfgp,#diag{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:#000a}
#cfgp.open,#diag.open{display:flex}
#diag{z-index:10}
#diag pre{margin:0 0 10px;font:13px/1.55 monospace;white-space:pre-wrap;word-break:break-all;color:#dfe6ff;font-family:'DotGothic16',monospace}
#padb{position:fixed;display:none;align-items:center;justify-content:center;top:max(6px,env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 88px);width:36px;height:36px;box-sizing:border-box;border:2px solid #fff;border-radius:50%;background:#1a1f3a;font-size:16px;opacity:.75;z-index:6;pointer-events:none}
#padb.act{background:#6a7cff;opacity:1}
#padmsg{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000c;text-align:center;font-size:18px;line-height:1.7;padding:24px;box-sizing:border-box}
#padmsg.open{display:flex}
#cfgp .padmap{width:100%;min-height:44px;margin:0 0 6px;font-size:14px;border-width:2px;border-radius:10px}
#cfgp .box,#diag .box{width:min(92vw,420px);max-height:92dvh;overflow:auto;background:#0b0f2a;border:3px solid #fff;border-radius:12px;padding:14px;box-sizing:border-box}
#cfgp h2,#diag h2{margin:0 0 10px;font-size:18px;text-align:center;font-weight:normal}
#cfgp .row{margin:0 0 10px}
#cfgp .row>span{display:block;font-size:13px;margin:0 0 4px;color:#cfd6ff}
#cfgp .opts{display:flex;gap:6px}
#cfgp .opts button{flex:1;min-height:44px;font-size:15px;border-width:2px;border-radius:10px}
#cfgp .opts button.sel{background:#6a7cff}
#cfgp .close,#diag .close{width:100%;min-height:48px;font-size:17px;margin-top:4px}
@media (orientation:landscape) and (max-height:520px){
 #app{flex-direction:row;justify-content:center;align-items:center;padding-top:0}
 canvas{height:100dvh;width:calc(100dvh*512/448);max-width:none}
 #ctl{position:fixed;inset:0;width:auto;min-height:0;pointer-events:none;z-index:3;--pad:10px}
 #ctl #dpz,#ctl #ab{pointer-events:auto}
 #dp{bottom:calc(env(safe-area-inset-bottom) + 8px)}
 #ab{bottom:calc(env(safe-area-inset-bottom) + 8px + var(--u)*.3)}
}
</style></head><body>
<button id="mute" class="top" aria-label="BGM">🔊</button>
<button id="cfgb" class="top" aria-label="操作せってい">⚙</button>
<div id="cfgp"><div class="box"><h2>そうさ せってい</h2><div id="cfgrows"></div><button class="close" id="cfgx">とじる</button></div></div>
<div id="padb" aria-hidden="true">🎮</div>
<div id="padmsg"><div>🎮 コントローラーが きれたよ<br>つなぎなおして ボタンを おすか、<br>この がめんを タッチすると つづけられるよ</div></div>
<div id="diag"><div class="box"><h2>コントローラー しんだん</h2><pre id="diagt"></pre><button class="close" id="diagx">とじる</button></div></div>
<div id="app">
<canvas id="c"></canvas>
<div id="ctl">
<div id="dp"><span></span><button data-k="u">▲</button><span></span><button data-k="l">◀</button><span></span><button data-k="r">▶</button><span></span><button data-k="d">▼</button><span></span></div>
<div id="dpz"></div>
<div id="ab"><button class="run" data-k="run">はしる</button><button class="b" data-k="b">B</button><button data-k="a">A</button></div>
</div></div>
<script>
'use strict';
// ===== core: canvas, input, DQ-style windows =====
const W=512,H=448,T=32,VW=16,VH=14,S=3;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
cv.width=W*S;cv.height=H*S;
const FONT='"DotGothic16","Hiragino Kaku Gothic ProN","MS Gothic",monospace';
const keys={},pressed={},RUN={t:false,h:false};
const KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',Enter:'a',z:'a',' ':'a',x:'b',Escape:'b',Backspace:'b'};
addEventListener('keydown',e=>{if(e.key==='Shift'){RUN.h=true;return;}const m=KM[e.key];if(!m)return;e.preventDefault();if(!keys[m])pressed[m]=true;keys[m]=true;});
addEventListener('keyup',e=>{if(e.key==='Shift'){RUN.h=false;return;}const m=KM[e.key];if(m)keys[m]=false;});
const vib=ms=>{try{if(window.UICFG&&UICFG.vib===false)return;navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
// --- Gamepad (Switch Pro / Joy-Con / any standard pad). Nintendo layout(入れ替え済み): B=bottom(0)=決定, A=right(1)=キャンセル ---
const PAD={u:0,d:0,l:0,r:0,a:0,b:0,run:0};let padOn=false;
const PADINFO={ok:true,err:'',id:'',mapping:'',btn:[],axes:[],show:false};
function readPads(){ // iframe等でGamepad APIが禁止されていても例外でゲームが止まらないようにする
  try{const gps=navigator.getGamepads?navigator.getGamepads():[];PADINFO.ok=!!navigator.getGamepads;return gps||[];}
  catch(e){PADINFO.ok=false;PADINFO.err=String(e&&e.name||e);return [];}
}
const PMAP_DEF={a:[0,2,8],b:[1,3,9],run:[4,5,6,7]};
let PCAP=null;
function pmap(k){const m=window.UICFG&&UICFG.pmap&&UICFG.pmap[k];return Array.isArray(m)&&m.length?m:PMAP_DEF[k];}
function padUI(any,n){const b=document.getElementById('padb');if(!b)return;
  if(any!==b._on){b._on=any;b.style.display=any?'flex':'none';}
  if(any)b.classList.toggle('act',!!(n.u||n.d||n.l||n.r||n.a||n.b||n.run));}
function padLost(){if((typeof G!=="undefined"&&G.paused))return;G.paused=true;const e=document.getElementById('padmsg');if(e)e.classList.add('open');}
function padResume(){if(!((typeof G!=="undefined"&&G.paused)))return;G.paused=false;const e=document.getElementById('padmsg');if(e)e.classList.remove('open');for(const k in keys)keys[k]=false;clearKeys();}
function pollPad(){
  const gps=readPads();let n={u:0,d:0,l:0,r:0,a:0,b:0,run:0},any=false;
  for(const g of gps){if(!g||!g.connected)continue;any=true;const B=i=>g.buttons[i]&&(g.buttons[i].pressed||g.buttons[i].value>.5);
    const ax=g.axes[0]||0,ay=g.axes[1]||0,big=Math.abs(ax)>=Math.abs(ay);
    if(B(12)||(!big&&ay<-.5))n.u=1;if(B(13)||(!big&&ay>.5))n.d=1;
    if(B(14)||(big&&ax<-.5))n.l=1;if(B(15)||(big&&ax>.5))n.r=1;
    // 非standardマッピング(Joy-Con/一部のProコン)は十字キーが axes[9] のハット値で来る
    if(g.axes.length>9&&!(n.u||n.d||n.l||n.r)){const h=g.axes[9];
      if(h<=1.05){const d=Math.round((h+1)*3.5)%8;if([7,0,1].includes(d))n.u=1;if([1,2,3].includes(d))n.r=1;if([3,4,5].includes(d))n.d=1;if([5,6,7].includes(d))n.l=1;}}
    // ボタン割り当て(⚙で変更可)。初期値: 決定=B/Y/−(0,2,8) メニュー=A/X/+(1,3,9) はしる=L/R/ZL/ZR(4-7)
    const hit=ks=>ks.some(i=>B(i));
    if(hit(pmap('a')))n.a=1;if(hit(pmap('b')))n.b=1;if(hit(pmap('run')))n.run=1;
    const pv=PADINFO.prev||(PADINFO.prev=[]);
    g.buttons.forEach((b,i)=>{const on=!!(b&&(b.pressed||b.value>.5));if(on&&!pv[i]){PADINFO.last=i;if(PCAP){const f=PCAP;PCAP=null;try{f(i);}catch(e){}}}pv[i]=on;});
    PADINFO.id=(g.id||'').slice(0,40);PADINFO.mapping=g.mapping||'(none)';
    PADINFO.btn=g.buttons.map((b,i)=>b&&(b.pressed||b.value>.5)?i:-1).filter(i=>i>=0);PADINFO.axes=g.axes.map(v=>Math.round(v*10)/10);
    if(PADINFO.btn.length||n.u||n.d||n.l||n.r){try{bgmUnlock();}catch(e){}}  // コントローラー操作でもBGMを開始
  }
  if(PCAP){n={u:0,d:0,l:0,r:0,a:0,b:0,run:0};}   // 割り当て変更中は ゲームへ入力しない
  padUI(any,n);
  if(any&&!padOn){padOn=true;try{window.onPad&&window.onPad();}catch(e){}}
  if(!any&&padOn){padOn=false;PADINFO.id='';}
  for(const k of['u','d','l','r','a','b']){if(n[k]&&!PAD[k]){if(!keys[k])pressed[k]=true;keys[k]=true;}else if(!n[k]&&PAD[k])keys[k]=false;PAD[k]=n[k];}
  RUN.p=n.run;
}
addEventListener('gamepadconnected',e=>{try{window.onPad&&window.onPad(e.gamepad&&e.gamepad.id);padResume();}catch(_){}});
addEventListener('gamepaddisconnected',()=>{try{if(readPads().some(g=>g&&g.connected))return;if(G.mode==='map'||G.mode==='battle'||G.mode==='select')padLost();}catch(_){}});
addEventListener('keydown',e=>{if(G.paused){padResume();return;}if(e.key==='p'||e.key==='P'){window.padDiag&&padDiag();}});
document.addEventListener('pointerdown',()=>{if((typeof G!=="undefined"&&G.paused))padResume();},true);
// --- touch hardening: no double-tap zoom, no pinch, no scroll / pull-to-refresh, no long-press menu ---
(()=>{let last=0;
  document.addEventListener('touchend',e=>{const n=Date.now();if(n-last<400)e.preventDefault();last=n;},{passive:false});
  document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  for(const ev of['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart','dragstart'])document.addEventListener(ev,e=>e.preventDefault());
})();
// ===== 操作UI：十字キー(広い判定) / A・B(広い当たり判定) / 画面に合わせた自動最大サイズ / 設定(⚙) =====
var UICFG=Object.assign({size:2,swap:false,wide:true,op:.82,vib:true},(()=>{try{return JSON.parse(localStorage.getItem('dq_ui')||'{}')||{};}catch(e){return{};}})());
(()=>{
  const $=id=>document.getElementById(id);
  const ctl=$('ctl'),dp=$('dp'),ab=$('ab'),dpz=$('dpz');
  if(!ctl||!dp||!ab||!dpz)return;
  const SIZES=[.72,.86,1],landQ=matchMedia('(orientation:landscape) and (max-height:520px)');
  const save=()=>{try{localStorage.setItem('dq_ui',JSON.stringify(UICFG));}catch(e){}};
  // --- レイアウト：Aボタンの直径 u を「いま使える最大」に決め、ほかは全部 u から割り出す ---
  function layout(){
    const vw=innerWidth,vh=innerHeight,land=landQ.matches;
    ctl.classList.toggle('swap',!!UICFG.swap);ctl.style.setProperty('--op',UICFG.op);
    const r0=ctl.getBoundingClientRect();let u;
    if(land){const cw=vh*512/448,g=(vw-cw)/2;u=Math.min(Math.max((g-18)/2.3,vh*.22),vh*.27);}   // よこ持ち：画面の左右のあきスペースにちょうど収める
    else{u=Math.min((r0.width-28)/4.45,(r0.height-20)/2.3,130);}                                  // たて持ち：ゲーム画面の下ぜんぶが操作エリア
    u=Math.max(40,Math.floor(u*(SIZES[UICFG.size]||1)));ctl.style.setProperty('--u',u+'px');
    // 十字キーのタッチ判定ゾーン：見た目より広い（ひろい=操作エリアの片側ぜんぶ / ふつう=見た目+15%）
    const rc=ctl.getBoundingClientRect(),rd=dp.getBoundingClientRect(),ra=ab.getBoundingClientRect(),cw=rc.width,ch=rc.height,D=rd.width;
    let x0,x1,y0,y1;
    if(UICFG.wide){
      if(land){y0=Math.max(0,rd.top-rc.top-D*.5);y1=ch;
        if(!UICFG.swap){x0=0;x1=Math.min(rd.right-rc.left+D*.3,ra.left-rc.left-6);}else{x1=cw;x0=Math.max(rd.left-rc.left-D*.3,ra.right-rc.left+6);}}
      else{y0=0;y1=ch;if(!UICFG.swap){x0=0;x1=ra.left-rc.left-6;}else{x1=cw;x0=ra.right-rc.left+6;}}
    }else{x0=rd.left-rc.left-D*.15;x1=rd.right-rc.left+D*.15;y0=rd.top-rc.top-D*.15;y1=rd.bottom-rc.top+D*.15;}
    Object.assign(dpz.style,{left:x0+'px',top:y0+'px',width:Math.max(0,x1-x0)+'px',height:Math.max(0,y1-y0)+'px'});
  }
  // --- 十字キー：1本の指でスライドして向きを変える（角度で判定。ゾーンのどこを触ってもOK） ---
  let pid=null,cur=null;
  const set=k=>{if(k===cur)return;if(cur)keys[cur]=false;cur=k;if(k){if(!keys[k])pressed[k]=true;keys[k]=true;vib(5);}
    dp.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));};
  const calc=e=>{const r=dp.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),R=r.width/2;
    if(Math.hypot(x,y)<R*.12)return null;const ax=Math.abs(x),ay=Math.abs(y);
    const horiz=cur==='l'||cur==='r',vert=cur==='u'||cur==='d';
    let h=ax>=ay;if(horiz&&ax>=ay*.62)h=true;else if(vert&&ay>=ax*.62)h=false;   // ななめは 今の向きを優先(ヒステリシス)
    return h?(x<0?'l':'r'):(y<0?'u':'d');};
  dpz.addEventListener('pointerdown',e=>{e.preventDefault();if(pid!==null)return;pid=e.pointerId;try{dpz.setPointerCapture(pid);}catch(_){}set(calc(e));});
  dpz.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(calc(e));});
  const up=e=>{if(e.pointerId===pid){pid=null;set(null);}};
  dpz.addEventListener('pointerup',up);dpz.addEventListener('pointercancel',up);dpz.addEventListener('lostpointercapture',up);
  document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);   // 取りこぼし防止(キャプチャが外れても離したら必ず解除)
  // --- A / B / はしる：マルチタッチ、広い当たり判定(CSSの::after)、指が外へずれても押しっぱなし維持 ---
  ab.querySelectorAll('[data-k]').forEach(b=>{
    const k=b.dataset.k;
    if(k==='run'){b.addEventListener('pointerdown',e=>{e.preventDefault();RUN.t=!RUN.t;b.classList.toggle('on',RUN.t);b.textContent=RUN.t?'はしる ON':'はしる';vib(8);});return;}
    const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on');vib(8);};
    const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  });
  // --- 入力が残りっぱなしにならないように：画面を離れる/ブラウザ復帰/回転のとき全部リリース ---
  const rel=()=>{pid=null;set(null);for(const k in keys)keys[k]=false;ab.querySelectorAll('button:not(.run)').forEach(b=>b.classList.remove('on'));};
  addEventListener('blur',rel);addEventListener('pagehide',rel);addEventListener('orientationchange',rel);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)rel();});
  // --- そうさ せってい(⚙) ---
  const OPTS=[
    {t:'ボタンの おおきさ',k:'size',o:[['小',0],['中',1],['大(さいだい)',2]]},
    {t:'ボタンの はいち',k:'swap',o:[['みぎきき',false],['ひだりきき',true]]},
    {t:'十字キーの タッチはんい',k:'wide',o:[['ひろい',true],['ふつう',false]]},
    {t:'ボタンの こさ',k:'op',o:[['うすい',.55],['ふつう',.82],['こい',1]]},
    {t:'しんどう',k:'vib',o:[['あり',true],['なし',false]]}];
  const cfgp=$('cfgp'),rows=$('cfgrows');
  function render(){rows.innerHTML='';
    for(const r of OPTS){const row=document.createElement('div');row.className='row';row.innerHTML='<span>'+r.t+'</span><div class="opts"></div>';
      const box=row.lastChild;
      for(const [lab,val] of r.o){const b=document.createElement('button');b.textContent=lab;if(UICFG[r.k]===val)b.className='sel';
        b.addEventListener('pointerdown',e=>{e.preventDefault();UICFG[r.k]=val;save();layout();render();vib(10);});box.appendChild(b);}
      rows.appendChild(row);}
    const sec=document.createElement('div');sec.className='row';sec.innerHTML='<span>🎮 コントローラー（ホリコンなど）</span>';

    for(const k of['a','b','run']){const bt=document.createElement('button');bt.className='padmap';bt.textContent=names[k]+'：ボタン '+pmap(k).join('・')+'（おして へんこう）';

// ---- text & boxes ----
function text(s,x,y,c='#fff',sz=16){ctx.font=sz+'px '+FONT;ctx.fillStyle=c;ctx.textBaseline='top';ctx.fillText(s,x,y);}
function tw(s,sz=16){ctx.font=sz+'px '+FONT;return ctx.measureText(s).width;}
function box(x,y,w,h){
  ctx.fillStyle='#000';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(x+2,y+2,w-4,h-4);
  ctx.strokeStyle='#6a7cff';ctx.lineWidth=1;ctx.strokeRect(x+7,y+7,w-14,h-14);
}
function wrapText(s,maxw){
  ctx.font='16px '+FONT;const out=[];
  for(const para of s.split('\n')){let line='';
    for(const ch of para){if(ctx.measureText(line+ch).width>maxw){out.push(line);line=ch;}else line+=ch;}
    out.push(line);}
  return out;
}
function statBox(x,y,pc,w=150){
  box(x,y,w,112);
  text(pc.name,x+16,y+14);text('LV '+pc.lv,x+16,y+38);
  text('HP '+String(pc.hp).padStart(3,' '),x+16,y+62,pc.hp<=pc.mhp/4?'#ff6':'#fff');
  text('MP '+String(pc.mp).padStart(3,' '),x+16,y+84);
}

// ---- UI stack (async dialog / menu) ----
const UI=[];
function say(s,name){
  return new Promise(res=>{
    const L=wrapText(s,W-84),pages=[];
    for(let i=0;i<L.length;i+=3)pages.push(L.slice(i,i+3));
    UI.push({t:'msg',pages,p:0,n:0,name,res});
  });
}
async function sayAll(arr,name){for(const s of arr)await say(s,name);}
function choose(opts,o={}){
  return new Promise(res=>UI.push({t:'menu',opts,i:0,x:o.x??24,y:o.y??24,w:o.w,cancel:o.cancel,title:o.title,dis:o.dis||[],res}));
}
const HOLD={};
function repeat(k,start=16,every=4){if(keys[k]){const n=HOLD[k]=(HOLD[k]||0)+1;return n>start&&(n-start)%every===0;}HOLD[k]=0;return false;}
function uiUpdate(){
  const u=UI[UI.length-1];if(!u)return;
  if(u.t==='msg'){
    const tot=u.pages[u.p].join('').length;
    u.n=Math.min(tot,u.n+0.9);
    if(took('a')||took('b')||repeat('a',26,6)){
      if(u.n<tot)u.n=tot;
      else{u.p++;u.n=0;if(u.p>=u.pages.length){UI.pop();u.res();}}
    }
  }else if(u.t==='menu'){
    const n=u.opts.length;
    if(took('u')||repeat('u'))u.i=(u.i+n-1)%n;
    if(took('d')||repeat('d'))u.i=(u.i+1)%n;
    if(took('a')){if(!u.dis[u.i]){UI.pop();u.res(u.i);}}
    else if(took('b')&&u.cancel){UI.pop();u.res(-1);}
  }
}
function uiDraw(){
  for(const u of UI){
    if(u.t==='msg'){
      const y=H-132;box(12,y,W-24,120);
      if(u.name){const nw=tw(u.name)+44;box(12,y-38,nw,44);text(u.name,34,y-26,'#ffd23f');}
      let left=u.n;
      u.pages[u.p].forEach((ln,i)=>{text(ln.slice(0,Math.max(0,Math.floor(left))),34,y+20+i*28);left-=ln.length;});
      if(u.n>=u.pages[u.p].join('').length&&((G.tick>>4)&1))text('▼',W-52,y+88);
    }else if(u.t==='menu'){
      let w=u.w||Math.max(...u.opts.map(o=>tw(o)))+72;
      const th=u.title?30:0,h=u.opts.length*28+36+th;
      box(u.x,u.y,w,h);
      if(u.title)text(u.title,u.x+20,u.y+14,'#ffd23f');
      u.opts.forEach((o,i)=>text(o,u.x+44,u.y+18+th+i*28,u.dis[i]?'#777':'#fff'));
      text('▶',u.x+18,u.y+18+th+u.i*28);
    }
  }
}
async function fade(to,ms=350){
  const from=G.fade,n=Math.max(1,Math.floor(ms/16));
  for(let i=1;i<=n;i++){G.fade=from+(to-from)*i/n;await sleep(16);}
  G.fade=to;
}

function Grid(w,h,fill){
  const g=Array.from({length:h},()=>Array(w).fill(fill));
  const o={w,h,g,
    r(x,y,ww,hh,c){for(let j=y;j<y+hh;j++)for(let i=x;i<x+ww;i++)if(g[j]&&g[j][i]!==undefined)g[j][i]=c;return o;},
    p(x,y,c){if(g[y]&&g[y][x]!==undefined)g[y][x]=c;return o;},
    ps(list,c){for(const [x,y] of list)o.p(x,y,c);return o;},
    border(c){return o.r(0,0,w,1,c).r(0,h-1,w,1,c).r(0,0,1,h,c).r(w-1,0,1,h,c);},
    house(x,y,ww,hh,dx,top,floor){floor=floor||'f';o.r(x,y,ww,hh,'H').r(x+1,y+1,ww-2,hh-2,floor);return o.p(x+dx,top?y:y+hh-1,'D');}
  };
  return o;
}

async function pcDamage(n){sfx('hit');G.shake=12;G.pc.hp=Math.max(0,G.pc.hp-n);await sleep(260);}
async function foeBlink(){for(let i=0;i<6;i++){foe.vis=!foe.vis;await sleep(55);}foe.vis=true;}
function dmgOf(atk,def,var_=4){return Math.max(1,Math.floor(atk-def/2+rnd(Math.max(2,atk/var_))));}

async function useSpell(pc,sp,inBattle){
  if(pc.mp<sp.mp){await say('MPが たりない！');return false;}
  pc.mp-=sp.mp;
  if(sp.t==='heal'){const v=sp.p+rnd(Math.ceil(sp.p/4));pc.hp=Math.min(pc.mhp,pc.hp+v);sfx('heal');await say(`${pc.name}は ${sp.n}を となえた！\nHPが ${v} かいふくした！`);return true;}
  if(!inBattle){pc.mp+=sp.mp;await say('いまは つかえない！');return false;}
  await say(`${pc.name}は ${sp.n}！`);
  if(sp.t==='atk'){const d=Math.max(3,sp.p+rnd(Math.ceil(sp.p/3))-Math.floor(foe.m.def/4));sfx('crit');await foeBlink();foe.m.hp-=d;await say(`${foe.m.n}に ${d}の ダメージ！`);}
  else if(sp.t==='stun'){if(foe.m.boss&&rnd(3)>0){await say('しかし こうかが なかった！');}else if(rnd(10)<(sp.pr||7)){foe.stun=3;await say(`${foe.m.n}は うっとりして うごけない！`);}else await say('しかし こうかが なかった！');}
  else if(sp.t==='steal'){if(foe.stolen||foe.m.boss)await say('しかし なにも ぬすめなかった！');else{foe.stolen=1;const g=Math.max(5,Math.floor(foe.m.g*1.5));G.gold+=g;sfx('buy');await say(`${g}Gを ぬすんだ！`);}}
  return true;
}
function lvUp(pc){pc.lv++;const g=pc.gr;pc.mhp+=g.hp;pc.mmp+=g.mp;pc.atk+=g.atk;pc.def+=g.def;return pc.lv;}
const need=lv=>lv*lv*2+lv*6;
async function gainExp(pc,exp){
  pc.exp+=exp;
  while(pc.exp>=need(pc.lv)&&pc.lv<30){
    pc.exp-=need(pc.lv);const n=lvUp(pc);sfx('lvl');
    await say(`${pc.name}は レベルが ${n}に あがった！`);
    for(const sp of pc.spells)if(sp.lv===n)await say(`${sp.n}を おぼえた！`);
  }
}
async function battle(key,big){
  const base=MON[key],m=Object.assign({},base);m.mhp=m.hp;
  foe={m,key,vis:true,a:1,big:big||SZ[key]||1,stun:0};G.mode='battle';
  const pc=G.pc;sfx('enc');
  await sleep(200);
  await say(m.boss?`${m.n}が たちふさがった！`:`${m.n}が あらわれた！`);
  let turn=0;
  while(true){
    turn++;
    const cmd=await choose(['たたかう','じゅもん','どうぐ','にげる'],{x:12,y:128,w:150});
    let acted=true;
    if(cmd===0){
      await say(`${pc.name}の こうげき！`);
      const crit=rnd(14)===0;let d=dmgOf(pc.atk+pc.wp,m.def,3);if(crit)d=Math.floor(pc.atk+pc.wp+rnd(8)+4);
      if(rnd(20)===0){await say('ミス！ ダメージを あたえられない！');}
      else{sfx(crit?'crit':'hit');await foeBlink();m.hp-=d;await say((crit?'かいしんの いちげき！\n':'')+`${m.n}に ${d}の ダメージ！`);}
    }else if(cmd===1){
      const sps=pc.spells.filter(s=>s.lv<=pc.lv);
      if(!sps.length){await say('おぼえている じゅもんが ない！');acted=false;}
      else{const i=await choose(sps.map(s=>`${s.n} MP${s.mp}`),{x:176,y:130,cancel:1});
        if(i<0)acted=false;else acted=await useSpell(pc,sps[i],true);}
    }else if(cmd===2){
      const names=Object.keys(pc.items).filter(k=>pc.items[k]>0);
      if(!names.length){await say('どうぐを もっていない！');acted=false;}
      else{const i=await choose(names.map(n=>`${n} x${pc.items[n]}`),{x:176,y:130,cancel:1});
        if(i<0)acted=false;else acted=await useItem(pc,names[i]);}
    }else{
      if(m.boss){await say('にげられない！');}
      else if(rnd(4)>0){sfx('step');await say(`${pc.name}は にげだした！`);foe=null;G.mode='map';return 'run';}
      else await say('しかし まわりこまれてしまった！');
    }
    if(!acted){turn--;continue;}
    if(m.hp<=0){
      for(let a=1;a>0;a-=.1){foe.a=Math.max(0,a);await sleep(40);}
      sfx('win');await say(`${m.n}を たおした！`);
      if(m.exp||m.g){G.gold+=m.g;await say(`${m.exp}ポイントの けいけんちを かくとく！\n${m.g}ゴールドを てにいれた！`);await gainExp(pc,m.exp);}
      foe=null;G.mode='map';return 'win';
    }
    // foe turn
    if(foe.stun>0){foe.stun--;await say(`${m.n}は うごけない！`);continue;}
    if(m.boss&&turn%3===0){
      await say(`${m.n}の ${m.sp}！`);
      const d=Math.floor(m.atk*(.8+rnd(30)/100)-(pc.def+pc.ar)/3);await pcDamage(Math.max(5,d));await say(`${pc.name}は ${Math.max(5,d)}の ダメージを うけた！`);
    }else if(rnd(18)===0){await say(`${m.n}の こうげき！\nひらりと みをかわした！`);}
    else{
      await say(`${m.n}の こうげき！`);
      let d=dmgOf(m.atk,pc.def+pc.ar,5);if(pc.guard)d=Math.floor(d/2);
      await pcDamage(d);await say(`${pc.name}は ${d}の ダメージを うけた！`);
    }
    if(pc.hp<=0){await say(`${pc.name}は ちからつきた……`);foe=null;G.mode='map';return 'lose';}
  }
}
const ITEMFX={'やくそう':{hp:30,v:8},'やきざかな':{hp:22,v:6},'さかなの スープ':{hp:60,v:10,mp:5},'ヨイヤミだんご':{hp:40,v:6,mp:12},'げんきの玉':{full:1}};
async function useItem(pc,name){
  const fx=ITEMFX[name];if(!fx||!(pc.items[name]>0)){await say('いまは つかえない！');return false;}
  pc.items[name]--;sfx('heal');
  if(fx.full){pc.hp=pc.mhp;pc.mp=pc.mmp;await say(`${name}が かがやいた！\nHPとMPが ぜんかいふくした！`);return true;}
  const v=fx.hp+rnd(fx.v||1);pc.hp=Math.min(pc.mhp,pc.hp+v);let t=`${pc.name}は ${name}を つかった！\nHPが ${v} かいふくした！`;
  if(fx.mp){pc.mp=Math.min(pc.mmp,pc.mp+fx.mp);t+=`\nMPも ${fx.mp} かいふくした！`;}
  await say(t);return true;
}

async function inn(price){
  await say((GREET.inn[G.story]||'ようこそ やどやへ！')+`\nひとばん ${price}ゴールドですが おとまりに なりますか？`,'やどや');
  const i=await choose(['はい','いいえ'],{x:300,y:130,w:130});
  if(i!==0){await say('また おこしください。','やどや');return;}
  if(G.gold<price){await say('おや、おかねが たりないようですね……','やどや');return;}
  G.gold-=price;await fade(1,500);G.pc.hp=G.pc.mhp;G.pc.mp=G.pc.mmp;sfx('heal');await sleep(500);await fade(0,500);
  await say('ゆうべは おたのしみでしたね！\nまた どうぞ！','やどや');
}
async function shop(stock){
  await say(GREET.shop[G.story]||'いらっしゃい！ なにを おさがしで？','みせ');
  while(true){
    const opts=stock.map(s=>`${s.n}  ${s.price}G`).concat(['やめる']);
    const i=await choose(opts,{x:150,y:60,title:`もちぶん ${G.gold}G`,cancel:1});
    if(i<0||i>=stock.length){await say('まいどあり！ また きてね！','みせ');return;}
    const s=stock[i];
    if(G.gold<s.price){await say('おかねが たりないよ。','みせ');continue;}
    const pc=G.pc;
    if(s.t==='wp'&&s.v<=pc.wp){await say('いまの ぶきの ほうが つよいよ。','みせ');continue;}
    if(s.t==='ar'&&s.v<=pc.ar){await say('いまの ぼうぐの ほうが かたいよ。','みせ');continue;}
    G.gold-=s.price;sfx('buy');
    if(s.t==='item'){pc.items[s.n]=(pc.items[s.n]||0)+1;await say(`${s.n}を てにいれた！`);}
    else if(s.t==='wp'){pc.wp=s.v;pc.wpn=s.n;await say(`${s.n}を そうびした！\nこうげきりょくが あがった！`);}
    else{pc.ar=s.v;pc.arn=s.n;await say(`${s.n}を そうびした！\nしゅびりょくが あがった！`);}
  }
}

// ---- story flow ----
function goalText(){
  const f=G.f,s=G.story;
  if(s==='hero')return !f.mayor1?'そんちょうに はなしを きこう（むらの いえの おく）':!f.hermit1?'きたにしの はじまりの祠へ いこう':!f.b1?'ねむりの洞窟（みなみ）の プルンキングを たおせ':!f.b2?'みなと村の ちかくの こだまの洞窟へ。しょうしょう つよく なって から':!f.b3?'たかね村の ちかくの ほのおの洞窟の ドラゴンを たおせ':'ヨイヤミ村の ひがし、まおう城へ！';
  if(s==='vb')return !f.med?'つまから くすりを うけとろう':'みなと村の むすめに くすりを とどけよう（きたの おか を こえた むこう）';
  if(s==='mayor')return !f.hermit1m?'はじまりの祠（きたにし）の ひとに はなしを きこう':'ねむりの洞窟（みなみ）の おくの たからばこを さがせ';
  if(s==='minister')return '『まおうとの しょるい』を まおう城へ とどけよう（ヨイヤミ村の ひがし）';
  if(s==='hermit')return '山を おりて はじまりの村の やどやで スープを たべよう';
  if(s==='gal')return !f.ribbon?'ヨイヤミ村の ブティックで リボンを もらおう':'ステージの モデルに はなしかけよう';
  if(s==='rogue')return !f.key?'ろうやの かんしゅから カギを ぬすもう':!f.loot?'ほのおの洞窟の たからばこを あけろ':!f.donated?'たかね村の ほくとう ほし見の祠へ たからを とどけろ':'……';
  if(s==='cat'){const n=['kuro','tora','shiro','yami'].filter(k=>f[k]).length;return n<4?`なかまを あつめよう（のこり ${4-n}ひき）：はじまりの村・みなと村・たかね村・ヨイヤミの村`:'みなと村の つりばし（つりたいかいの かんりにん）で さくせんを じっこうしよう';}
  return '';
}
function mkPC(id){
  const c=CHARS[id];
  return {id,name:c.name,lv:c.lv,exp:0,mhp:c.hp,hp:c.hp,mmp:c.mp,mp:c.mp,atk:c.atk,def:c.def,wp:c.wp,wpn:c.wpn,ar:c.ar,arn:c.arn,gr:GR,spells:c.spells,items:Object.assign({},c.items)};
}
function clearedList(){try{const l=JSON.parse(storeGet('dq_cleared')||'[]');return Array.isArray(l)?l:[];}catch(e){return[];}}   // localStorage不可(Artifact等)でもメモリに保持
function markCleared(id){try{const l=clearedList();if(!l.includes(id)){l.push(id);storeSet('dq_cleared',JSON.stringify(l));}}catch(e){}}
async function startStory(id){
  const c=CHARS[id];
  G.story=id;G.f={};G.open={};G.fx=[];G.pc=mkPC(id);G.gold=c.gold;G.home=c.map.startsWith('v')?c.map:'v1';
  if(id!=='hero'){G.f.b1=G.f.b2=G.f.b3=1;}
  await fade(1,300);G.mode='card';G.card=c.title;await sleep(1500);
  await warpTo(c.map,c.x,c.y,false);G.dir=0;
  G.mode='map';G.card=null;await fade(0,500);autoSave();
  for(const s of c.intro)await say(s,id==='hero'?'':c.name);
  if(id==='hero'){await say('(とびらは ほうこうキーで すすむと じどうで ひらく。たからばこや ひとへは Aボタン。まずは いえの とびらを あけて むらへ でよう)');}
}
async function finishStory(){
  G.busy=true;
  const c=CHARS[G.story];
  await fade(1,600);G.mode='card';G.card='おしまい';
  sfx('win');
  await fade(0,300);
  await sayAll(c.end);
  markCleared(G.story);
  await fade(1,500);
  G.busy=false;
  await selectStory(true);
}
async function onLose(){
  G.busy=true;
  await fade(1,500);G.mode='map';
  await say('めのまえが まっくらに なった……');
  G.gold=Math.floor(G.gold/2);G.pc.hp=G.pc.mhp;G.pc.mp=G.pc.mmp;
  await warpTo(G.home,MAPS[G.home].start.x,MAPS[G.home].start.y,false);
  await fade(0,500);
  await say(`${G.pc.name}よ、ちからつきて しまうとは なさけない！\nおかねは はんぶんに なってしまった……。`);
  G.busy=false;
}
async function selectStory(afterEnd){
  G.mode='select';G.card=null;
  const cl=clearedList();
  const all7=ORDER.every(id=>cl.includes(id));
  if(afterEnd&&cl.includes('cat')&&!G.f.credits){G.f.credits=1;await credits();return;}
  if(afterEnd)await say('？これは、だれの ものがたり だったのか……。\nだれかに とっては、ここからが はじまり。');
  if(afterEnd&&all7&&!cl.includes('cat')&&!G.f.catHint){G.f.catHint=1;await say('……にゃあ。\nどこかで、ねこの なきごえが した。\n(？？？ もう１つの にゃん生 が ひらかれた！)');}
  while(true){
    const unlocked=cl.includes('hero');
    const ids=ORDER.concat(all7?['cat']:[]);
    const dis=ids.map((id,i)=>i>0&&!unlocked);
    const opts=ids.map((id,i)=>(cl.includes(id)?'★ ':'　')+(dis[i]?'？？？':CHARS[id].label));
    const i=await choose(opts,{x:40,y:30,w:432,title:afterEnd?'だれの じせいのくを あゆむ？':'まずは じせいのくを えらぼう',dis});
    await startStory(ids[i]);return;
  }
}
async function credits(){
  await fade(1,500);G.mode='card';G.card='FIN';await fade(0,500);
  await sayAll(['ゆうしゃ、むらびと、そんちょう、だいじん、ほこらの ひと、ギャル、ごろつき、そして ねこ。','だれも が、どこかの ものがたりの しゅやく だった。','――あなたの ものがたりも、きっと。','ありがとうございました！'],'');
  await sayAll(['……ふと、どこかで しらない たびびとの ふえが きこえた。','（？？？　つづく……かも　？？？）'],'');
  await fade(1,600);G.card=null;G.mode='title';await fade(0,500);
}

const fishWait=async(ms)=>{const t0=Date.now();while(Date.now()-t0<ms)await sleep(30);};
async function castLine(win){
  G.fish={phase:'wait',t:0};
  await say('つりざおを なげた……');
  await fishWait(700+rnd(1400));
  G.apress=0;sfx('crit');G.fish.phase='hit';G.fish.t=0;G.banner={text:'！ ヒット ！　Aボタンで ひけ！',t:46};
  const t0=Date.now();let ok=false;
  while(Date.now()-t0<(win||900)){if(G.apress>0){ok=true;break;}await sleep(16);}
  G.banner=null;
  if(ok){sfx('hit');G.fish.phase='catch';G.fish.t=0;return true;}
  G.fish.phase='miss';G.fish.t=0;return false;
}

'use strict';
// ===== save / load (localStorage with in-memory fallback) =====
const MEMSAVE={};
const SAVE_KEY=i=>'dq_save_'+i;
function storeGet(k){try{const v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}return MEMSAVE[k]||null;}
function storeSet(k,v){MEMSAVE[k]=v;try{localStorage.setItem(k,v);}catch(e){}}
function snapshot(){
  return {ver:1,t:Date.now(),story:G.story,f:G.f,open:G.open,pc:G.pc,gold:G.gold,home:G.home,map:G.map.id,x:G.px,y:G.py,dir:G.dir};
}
function writeSlot(i){try{storeSet(SAVE_KEY(i),JSON.stringify(snapshot()));return true;}catch(e){return false;}}
function autoSave(){if(G.mode==='map'&&G.pc&&G.map&&G.map.kind!=='cave')writeSlot(0);}
function readSlot(i){
  const raw=storeGet(SAVE_KEY(i));if(!raw)return null;
  try{const d=JSON.parse(raw);if(d&&d.ver===1&&MAPS[d.map]&&CHARS[d.story]&&d.pc)return d;}catch(e){}
  return null;
}
function slotLabel(i){
  const d=readSlot(i),nm=i===0?'オート':'セーブ'+i;
  if(!d)return `${nm}　――からっぽ――`;
  return `${nm}　${CHARS[d.story].label} LV${d.pc.lv}　${d.map==='world'?worldName(d.x,d.y):MAPS[d.map].name}`;
}
function applySave(d){
  G.story=d.story;G.f=d.f||{};G.open=d.open||{};G.pc=d.pc;G.gold=d.gold;G.home=d.home||'v1';G.fx=[];
  G.pc.spells=CHARS[d.story].spells;G.pc.gr=GR;
  G.map=MAPS[d.map];G.px=d.x;G.py=d.y;G.dir=d.dir||0;G.mv=null;G.steps=0;G.card=null;
  refreshMap();G.wname=G.map.id==='world'?worldName(d.x,d.y):null;G.banner={text:G.map.id==='world'?worldName(d.x,d.y):G.map.name,t:110};
}
async function saveMenu(){
  const i=await choose([1,2,3].map(slotLabel).concat(['やめる']),{x:20,y:60,w:470,title:'どこに セーブする？',cancel:1});
  if(i<0||i>2)return;
  if(G.map.kind==='cave'||G.map.kind==='world'){/* allowed everywhere; kept simple */}
  if(readSlot(i+1)){const c=await choose(['うわがきする','やめる'],{x:300,y:130,w:170,cancel:1});if(c!==0)return;}
  sfx('buy');
  await say(writeSlot(i+1)?'ぼうけんの しょを きろくした！':'セーブに しっぱいした……。');
}
async function loadMenu(fromTitle){
  const have=[0,1,2,3].filter(i=>readSlot(i));
  if(!have.length){await say('セーブデータが ない。');return false;}
  const dis=[0,1,2,3].map(i=>!readSlot(i));
  const i=await choose([0,1,2,3].map(slotLabel).concat(['やめる']),{x:20,y:50,w:470,title:'どれを ロードする？',cancel:1,dis:dis.concat([false])});
  if(i<0||i>3)return false;
  const d=readSlot(i);if(!d)return false;
  await fade(1,250);applySave(d);G.mode='map';
  await fade(0,250);
  await say('ぼうけんの しょを よみこんだ！');
  return true;
}
async function titleFlow(){
  if([0,1,2,3].some(i=>readSlot(i))){
    const i=await choose(['はじめから','つづきから'],{x:170,y:230,w:170,cancel:0});
    if(i===1){if(await loadMenu(true))return;}
    if(i<0)return;
  }
  await selectStory(false);
}

function bgmInit(){

  const dl=ac.createDelay(1.5);dl.delayTime.value=.375;const fb=ac.createGain();fb.gain.value=.34;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;

function prng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
// 1音: オシレータ(デチューン重ね) → ローパス(エンベロープ) → ゲイン(ADR) → bus
function voice(run,t,f,dur,o){
  const ac=BGM.ac,g=ac.createGain(),flt=ac.createBiquadFilter();

function drum(run,t,kind,vel){

  if(kind==='s'){f.type='bandpass';f.frequency.value=1800;f.Q.value=.7;g.gain.setValueAtTime(.32*vel,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);

function melodyBar(T,bar,chord){
  const pcs=CT[chord[1]].map(i=>(chord[0]+i)%12),sc=MODE[T.mode].map(i=>(T.key+i)%12);
  const pool=[];for(let n=62;n<=91;n++)if(sc.includes(n%12))pool.push(n);
  const ph=T.mphr[bar%T.mphr.length],r=prng(T.bpm*131+T.key*977+ph*7919+(ph?bar%2:0));
  const tmpl=RHY[T.rhy[Math.floor(r()*T.rhy.length)]],ev=[];
  let idx=pool.findIndex(n=>pcs.includes(n%12)&&n>=72);if(idx<0)idx=Math.floor(pool.length/2);idx+=Math.floor(r()*4)-1;idx=Math.max(0,Math.min(pool.length-1,idx));
  tmpl.forEach(([st,len],i)=>{
    if(T.sparse&&r()<T.sparse)return;
    if(st%4===0&&i>0){let best=idx,bd=99;for(let k=0;k<pool.length;k++){if(pcs.includes(pool[k]%12)){const d=Math.abs(k-idx)+r()*1.5;if(d<bd){bd=d;best=k;}}}idx=best;}
    else if(i>0){idx+=(r()<.5?-1:1)*(r()<.7?1:2);}
    if(bar%4===3&&i===tmpl.length-1){let k=pool.findIndex(n=>n%12===chord[0]%12&&n>=70);if(k>=0)idx=k;}
    idx=Math.max(0,Math.min(pool.length-1,idx));
    ev.push([st,pool[idx],len]);
  });
  return ev;

function bgmStep(run,s,t){

    voice(run,t,mtof(n),d16*1.6,{type:'square',vol:.11,a:.005,r:.1,cut:420,cutEnd:260,q:1.4});voice(run,t,mtof(n-12),d16*1.8,{type:'sine',vol:.16,a:.01,r:.12,cut:300});}
  if(T.arp&&T.arpVol){const a=T.arp[k%T.arp.length];
    if(a&&a!=='.'){const i=+a,n=ch[0]+24+tones[i%tones.length]+(i>=tones.length?12:0);

  if(T.lead&&run.mel)for(const [st,n,len] of run.mel)if(st===k){
    const sw=T.sw?d16*T.sw:0;
    voice(run,t+sw+jt(),mtof(n),d16*len*.92,{type:T.leadType,vol:T.lead*(.85+Math.random()*.3),a:T.leadType==='sawtooth'?.012:.02,r:.18,cut:T.leadType==='sawtooth'?2600:4200,cutEnd:1400,det:T.leadType==='sawtooth'?[-7,7]:[0,4],pan:.15});}
  if(T.kick&&T.kick[k]==='x')drum(run,t,'k',k===0?1:.85);
  if(T.snare&&T.snare[k]==='x')drum(run,t,'s',1);

function bgmTick(){

function bgmStart(name){

  run.fade=ac.createGain();run.fade.gain.setValueAtTime(.0001,now);run.fade.gain.linearRampToValueAtTime(1,now+1.4);run.fade.connect(BGM.master);
  run.bus=ac.createGain();run.bus.connect(run.fade);

function ambNoise(a,dest,type,freq,q,vol,lfoHz,lfoDepth){
  const n=a.createBufferSource();n.buffer=BGM.noise;n.loop=true;
  const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=a.createGain();g.gain.value=vol;
  n.connect(f);f.connect(g);g.connect(dest);n.start(0,Math.random());
  const srcs=[n];
  if(lfoHz){const l=a.createOscillator();l.frequency.value=lfoHz;const lg=a.createGain();lg.gain.value=lfoDepth;l.connect(lg);lg.connect(g.gain);l.start();srcs.push(l);}
  return srcs;
}
function ambSet(kind){
  if(AMB.kind===kind)return;
  const ac=BGM.ac;if(!ac||ac.state!=='running'||!BGM.noise)return;
  AMB.kind=kind;const old=AMB.cur,now=ac.currentTime;
  if(old){old.g.gain.cancelScheduledValues(now);old.g.gain.setValueAtTime(old.g.gain.value,now);old.g.gain.linearRampToValueAtTime(0,now+1.2);
    setTimeout(()=>{try{old.srcs.forEach(s=>s.stop());old.g.disconnect();}catch(e){}},1600);}
  AMB.cur=null;if(!kind)return;
  const g=ac.createGain();g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(1,now+2);g.connect(BGM.master);
  let srcs=[];
  const wind=(v,f,q)=>srcs.push(...ambNoise(ac,g,'bandpass',f,q,v,.09+Math.random()*.06,v*.7));
  if(kind==='field'||kind==='village'){wind(.05,500,.6);}
  if(kind==='harbor'){wind(.03,550,.6);srcs.push(...ambNoise(ac,g,'lowpass',650,.4,.06,.13,.045));}
  if(kind==='waste'){wind(.09,380,.5);}
  if(kind==='night'){wind(.04,420,.6);}
  if(kind==='shrine'){wind(.025,600,.7);}
  if(kind==='cave'){srcs.push(...ambNoise(ac,g,'lowpass',120,.5,.07,.05,.025));}
  if(kind==='castle'){srcs.push(...ambNoise(ac,g,'lowpass',140,.5,.08,.04,.03));wind(.03,300,.5);}
  AMB.cur={g,srcs,next:now+1.5};
}
function ambEvent(a,cur,now){
  const k=AMB.kind,g=cur.g,pan=(Math.random()-.5)*1.4;
  const tone=(t,type,f0,f1,dur,vol,pn)=>{const o=a.createOscillator(),e=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);
    e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(vol,t+dur*.2);e.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let out=e;if(a.createStereoPanner){const p=a.createStereoPanner();p.pan.value=pn;e.connect(p);out=p;}
    o.connect(e);out.connect(g);if(BGM.rev){const s=a.createGain();s.gain.value=.5;out.connect(s);s.connect(BGM.rev);}o.start(t);o.stop(t+dur+.05);};
  if(k==='field'||k==='village'){const f=2300+Math.random()*1700,n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)tone(now+i*.12,'sine',f*(1+i*.05),f*1.45,.09,.028,pan);cur.next=now+3+Math.random()*8;}
  else if(k==='harbor'){if(Math.random()<.6){tone(now,'sawtooth',1100,1500,.22,.012,pan);tone(now+.24,'sawtooth',1500,800,.34,.012,pan);}else{const f=2600+Math.random()*1200;tone(now,'sine',f,f*1.4,.09,.025,pan);}cur.next=now+4+Math.random()*9;}
  else if(k==='night'||k==='shrine'){const f=4100+Math.random()*700;for(let i=0;i<5;i++)tone(now+i*.07,'sine',f,f*1.01,.045,.011,pan);cur.next=now+.8+Math.random()*1.6;}
  else if(k==='cave'){tone(now,'sine',1500,650,.16,.03,pan);cur.next=now+1.6+Math.random()*4.5;}
  else cur.next=now+6;
}
function ambTick(){
  const ac=BGM.ac,cur=AMB.cur;if(!ac||!cur||ac.state!=='running')return;
  if(ac.currentTime>=cur.next)ambEvent(ac,cur,ac.currentTime+.02);
}

const WOK='.,=xfzc';
function npcWander(canStart){
  const m=G.map;
  for(const n of npcsOn(m.id)){
    if(!n.wander||n.mon)continue;
    if(n.hx===undefined){n.hx=n.x;n.hy=n.y;n.wait=30+rnd(120);}
    if(n.mv){if(++n.mv.t>=n.mv.d)n.mv=null;continue;}
    if(!canStart||window.NOWANDER)continue;
    if(n.wait>0){n.wait--;continue;}
    const d=rnd(4),nx=n.x+FACE[d][0],ny=n.y+FACE[d][1];n.dir=d;n.wait=40+rnd(160);
    if(Math.max(Math.abs(nx-n.hx),Math.abs(ny-n.hy))>n.wander)continue;
    if(nx<0||ny<0||nx>=m.w||ny>=m.h||!WOK.includes(m.g[ny][nx])||npcAt(nx,ny))continue;
    if((nx===G.px&&ny===G.py)||(G.mv&&nx===G.px+G.mv.dx&&ny===G.py+G.mv.dy))continue;
    n.mv={fx:n.x,fy:n.y,t:0,d:14};n.x=nx;n.y=ny;

    if(G.map.g[ty]&&G.map.g[ty][tx]==='D'&&!npcAt(tx,ty)){G.busy=true;openDoor(tx,ty).finally(()=>{G.busy=false;});return;}

async function onStep(){
  const m=G.map,t=m.g[G.py][G.px];
  if(m.kind==='world'){
    const w=m.warps[G.px+','+G.py];
    if(w){G.busy=true;sfx('open');await warpTo(w.to,w.x,w.y);G.busy=false;return;}
  }else if(t==='E'){
    G.busy=true;sfx('open');const r=m.ret;await warpTo(r.map,r.x,r.y);G.busy=false;return;
  }
  let zone=0,rate=0;
  if(m.kind==='world'){const wn=worldName(G.px,G.py);if(wn!==G.wname){G.wname=wn;G.banner={text:wn,t:110};}
    zone=worldZone(G.px,G.py);rate=t==='F'?9:t==='='?32:15;}
  else if(m.kind==='cave'){zone=m.enc;rate=9;}

const CR={map:null,list:[]};
function critInit(m){
  CR.map=m.id;CR.list=[];
  const cfg={v1:['hen','hen','hen','cat'],v2:['hen','hen','cat'],v3:['cat','cat'],v4:['cat','cat']}[m.id];if(!cfg)return;
  const r=prng(m.w*977+m.h*131+m.id.charCodeAt(1));

    for(let tr=0;tr<80;tr++){const x=1+Math.floor(r()*(m.w-2)),y=1+Math.floor(r()*(m.h-2));
      if(GROUNDCH.includes(m.g[y][x])&&!npcAt(x,y)&&!(x===G.px&&y===G.py)&&!CR.list.some(c=>c.tx===x&&c.ty===y)){
        CR.list.push({k,x,y,tx:x,ty:y,wait:30+Math.floor(r()*120),dir:r()<.5?1:-1,ph:r()*6,run:0});break;}}

function critFree(m,x,y,self){
  return x>0&&y>0&&x<m.w-1&&y<m.h-1&&GROUNDCH.includes(m.g[y][x])&&!npcAt(x,y)&&!(x===G.px&&y===G.py)&&!(G.mv&&x===G.px+G.mv.dx&&y===G.py+G.mv.dy)&&!CR.list.some(c=>c!==self&&Math.round(c.tx)===x&&Math.round(c.ty)===y);

function critStep(m,c){
  const dxp=c.x-G.px,dyp=c.y-G.py,dist=Math.hypot(dxp,dyp);
  if(c.tx!==c.x||c.ty!==c.y){
    const sp=(c.run?.095:.032),dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
    if(d<=sp){c.x=c.tx;c.y=c.ty;c.wait=c.run?4:40+Math.floor(Math.random()*160);c.run=0;}
    else{c.x+=dx/d*sp;c.y+=dy/d*sp;if(Math.abs(dx)>.01)c.dir=dx>0?1:-1;}
    return;
  }
  if(c.wait>0&&dist>1.7){c.wait--;return;}
  const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>({x:c.x+a,y:c.y+b})).filter(p=>critFree(m,p.x,p.y,c));
  if(!opts.length){c.wait=30;return;}
  if(dist<1.7){opts.sort((a,b)=>Math.hypot(b.x-G.px,b.y-G.py)-Math.hypot(a.x-G.px,a.y-G.py));c.tx=opts[0].x;c.ty=opts[0].y;c.run=1;}
  else{const p=opts[Math.floor(Math.random()*opts.length)];c.tx=p.x;c.ty=p.y;c.run=0;}
}

      poly(g,[[1,-15],[1.6,-19],[4,-16]],'#e8a84a','#3a2a1a');poly(g,[[5,-16],[7.4,-18.6],[7,-14.6]],'#e8a84a','#3a2a1a');}

      poly(g,[[4.2,-10.2-hop],[4.8,-13.4-hop],[6.8,-10.8-hop]],'#e8a84a','#3a2a1a');poly(g,[[7.4,-10.6-hop],[9.6,-12.6-hop],[9,-9.2-hop]],'#e8a84a','#3a2a1a');
      g.strokeStyle='#3a2a1a';for(const lx of[-4,-1,2.5,5]){g.beginPath();g.moveTo(lx,-3-hop*.5);g.lineTo(lx+(moving?Math.sin(t*.5+lx)*1.2:0),-.4);g.stroke();}}

const PH_LEN=5400,PHN=['あさ','ゆうがた','よる'];
G.clock=0;G.lastPh=0;
const phaseNow=()=>Math.floor(G.clock/PH_LEN)%3;
const dayCycle=()=>Math.floor(G.clock/(PH_LEN*3));
const TINT=[[255,236,190,.05],[255,125,55,.18],[8,14,66,.46]];
function isDusk(m){return m.id==='v4'||(m.id==='world'&&typeof worldZone==='function'&&worldZone(G.px,G.py)===4);}
function dayTint(m){
  if(isDusk(m))return[150,70,150,.16];
  const p=phaseNow(),f=(G.clock%PH_LEN)/PH_LEN,a=TINT[p],b=TINT[(p+1)%3],k=f>.85?(f-.85)/.15:0;
  return a.map((v,i)=>v+(b[i]-v)*k);

function drawWorldFx(m,cx,cy){
  if(G.mode!=='map')return;

  const ph=phaseNow();
  if(ph!==G.lastPh){G.lastPh=ph;if((m.kind==='village'||m.kind==='world')&&!G.busy)G.banner={text:['あさに なった！','ひが かたむいてきた……','よるに なった……'][ph],t:110};}

  const x0=Math.max(0,Math.floor(cx/T)),x1=Math.min(m.w-1,Math.floor((cx+W)/T)),y0=Math.max(0,Math.floor(cy/T)),y1=Math.min(m.h-1,Math.floor((cy+H)/T));

  ctx.save();

  ctx.lineWidth=1.2;ctx.lineCap='round';
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(m.g[y][x]!=='~')continue;

    if(a>0){ctx.strokeStyle=`rgba(255,255,255,${a})`;const yy=py+10+Math.sin(p*.7)*3;ctx.beginPath();ctx.moveTo(px+5,yy);ctx.quadraticCurveTo(px+16,yy-3,px+27,yy);ctx.stroke();}

  }

}
